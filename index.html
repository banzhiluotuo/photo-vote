<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摄影作品投票</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --line:#2e333d;
    --txt:#e8eaed; --sub:#9aa0a8; --accent:#ff5a5f; --accent2:#ffb400;
    --ok:#2ecc71;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#0f1115 0%,#15181f 100%);
    color:var(--txt);min-height:100vh;padding-bottom:90px;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    text-align:center;padding:22px 16px 12px;
    position:sticky;top:0;z-index:50;
    background:rgba(15,17,21,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  header h1{font-size:19px;letter-spacing:1px;}
  header p{color:var(--sub);font-size:12px;margin-top:5px;}
  .ticket-badge{
    display:inline-flex;align-items:center;gap:6px;margin-top:9px;
    background:var(--card2);border:1px solid var(--line);
    padding:5px 13px;border-radius:99px;font-size:12px;
  }
  .ticket-badge b{color:var(--accent2);}

  /* ===== 默认（手机）：强制双列 ===== */
  .wrap{
    max-width:1100px;margin:0 auto;padding:12px;
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
  }
  /* 平板/桌面：自适应多列 */
  @media (min-width:640px){
    .wrap{padding:16px;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
  }

  .card{
    position:relative;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .15s,box-shadow .15s,border-color .15s;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 26px rgba(0,0,0,.45);border-color:#3a4150;}
  .thumb{
    width:100%;aspect-ratio:1/1;object-fit:cover;display:block;
    background:#0a0c10;cursor:zoom-in;
  }
  .info{padding:9px 10px 11px;display:flex;flex-direction:column;gap:7px;flex:1;}
  .num{
    font-size:11px;color:var(--sub);letter-spacing:.5px;
    background:var(--card2);border-radius:6px;padding:2px 8px;width:fit-content;
  }
  .name{font-size:14px;font-weight:600;line-height:1.3;word-break:break-word;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;}
  .meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:6px;}
  .votes{font-size:12px;color:var(--sub);white-space:nowrap;}
  .votes b{color:var(--accent2);font-size:16px;margin-right:2px;}
  .btn{
    border:none;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600;
    cursor:pointer;background:var(--card2);color:var(--txt);
    border:1px solid var(--line);transition:all .15s;white-space:nowrap;
  }
  .btn:hover{background:#2c313c;}
  .btn.vote{background:linear-gradient(135deg,var(--accent),#ff7a5f);color:#fff;border:none;flex:1;}
  .btn.vote:hover{filter:brightness(1.1);}
  .btn.vote:disabled,.btn.vote.done{background:#2a2e36;color:var(--sub);cursor:not-allowed;filter:none;}
  .rank-tag{
    position:absolute;top:8px;left:8px;z-index:2;
    font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;
    background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  }

  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);
    background:#2a2e36;color:#fff;padding:10px 18px;border-radius:10px;
    font-size:14px;opacity:0;transition:all .25s;pointer-events:none;z-index:999;
    border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.5);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .footer-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:rgba(20,23,29,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:11px 16px;
    display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;
  }
  .footer-bar span{font-size:12.5px;color:var(--sub);}
  .footer-bar b{color:var(--accent2);}

  /* ===== 详情大图层 ===== */
  .lightbox{
    position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;
    display:none;flex-direction:column;
    align-items:center;justify-content:center;padding:16px;
    -webkit-tap-highlight-color:transparent;
  }
  .lightbox.show{display:flex;}
  .lb-imgwrap{
    flex:1;display:flex;align-items:center;justify-content:center;
    width:100%;overflow:hidden;
  }
  .lightbox img#lightboxImg{
    max-width:100%;max-height:100%;border-radius:12px;
    object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.6);
  }
  .lb-close{
    position:absolute;top:14px;right:14px;z-index:10;
    width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.5);color:#fff;font-size:20px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
  }
  .lb-nav{
    position:absolute;top:50%;transform:translateY(-50%);z-index:10;
    width:44px;height:64px;border:none;border-radius:10px;cursor:pointer;
    background:rgba(255,255,255,.08);color:#fff;font-size:26px;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
    transition:background .15s;
  }
  .lb-nav:hover{background:rgba(255,255,255,.18);}
  .lb-nav.prev{left:8px;}
  .lb-nav.next{right:8px;}
  .lb-info{
    width:100%;max-width:640px;margin-top:14px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .lb-info .cap{color:#fff;font-size:16px;font-weight:600;line-height:1.4;word-break:break-word;}
  .lb-info .lb-meta{display:flex;align-items:center;gap:14px;justify-content:center;}
  .lb-info .lb-votes{color:var(--sub);font-size:13px;}
  .lb-info .lb-votes b{color:var(--accent2);font-size:18px;margin-right:2px;}
  .lb-info .btn.vote{flex:none;padding:10px 26px;}
  .lb-count{color:var(--sub);font-size:12px;}

  .loading{text-align:center;color:var(--sub);padding:60px 0;grid-column:1/-1;}
</style>
</head>
<body>

<header>
  <h1>📷 摄影作品投票</h1>
  <p>选出你最喜欢的摄影作品 · 每人限投 2 票</p>
  <div class="ticket-badge">剩余票数：<b id="ticketLeft">2</b> / 2</div>
</header>

<div class="wrap" id="grid">
  <div class="loading">加载中…</div>
</div>

<div class="footer-bar">
  <span>总票数：<b id="totalVotes">0</b> · 共 51 件作品</span>
</div>

<div class="toast" id="toast"></div>

<!-- 详情大图层 -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="关闭">✕</button>
  <button class="lb-nav prev" id="lbPrev" aria-label="上一张">‹</button>
  <button class="lb-nav next" id="lbNext" aria-label="下一张">›</button>
  <div class="lb-imgwrap">
    <img id="lightboxImg" src="" alt="">
  </div>
  <div class="lb-info">
    <div class="cap" id="lightboxCap"></div>
    <div class="lb-count" id="lightboxCount"></div>
    <div class="lb-meta">
      <div class="lb-votes"><b id="lightboxVotes">0</b>票</div>
      <button class="btn vote" id="lightboxVoteBtn">投一票</button>
    </div>
  </div>
</div>

<script>
const API = "/api/vote";
let works = [];
let votes = {};      // { id: count }
let myVotes = {};    // { id: count } 我投过的
const MAX_TICKETS = 2;
const STORE_KEY = "photo_vote_my_votes_v1";
let lbIndex = -1;    // 当前大图对应的 works 索引

function getMyVotes(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }catch(e){ return {}; }
}
function setMyVotes(v){ localStorage.setItem(STORE_KEY, JSON.stringify(v)); }
function myTicketUsed(){ return Object.values(myVotes).reduce((a,b)=>a+b,0); }

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove("show"), 1800);
}

async function fetchWorks(){
  const r = await fetch("/works.json");
  works = await r.json();
}
async function fetchVotes(){
  const r = await fetch(API, {cache:"no-store"});
  const d = await r.json();
  votes = d.votes || {};
}
function getVote(id){ return votes[String(id)] || votes[id] || 0; }

function render(){
  const grid = document.getElementById("grid");
  const used = myTicketUsed();
  document.getElementById("ticketLeft").textContent = MAX_TICKETS - used;
  let total = 0;
  const sorted = [...works].sort((a,b)=> getVote(b.id)-getVote(a.id));
  const rankMap = {};
  sorted.forEach((w,i)=> rankMap[w.id] = i+1);

  grid.innerHTML = works.map(w=>{
    const v = getVote(w.id);
    total += v;
    const mine = myVotes[w.id] || 0;
    const canVote = (MAX_TICKETS - used) > 0 && mine < 1;
    const rank = rankMap[w.id];
    let tag = "";
    if(rank===1) tag = '<div class="rank-tag" style="color:#ffd700">🥇 第1名</div>';
    else if(rank===2) tag = '<div class="rank-tag" style="color:#c0c0c0">🥈 第2名</div>';
    else if(rank===3) tag = '<div class="rank-tag" style="color:#cd7f32">🥉 第3名</div>';
    return `
    <div class="card" data-id="${w.id}">
      ${tag}
      <img class="thumb" src="images/${w.id}.jpg" alt="${w.name}" loading="lazy"
           onclick="openLightbox(${w.id})">
      <div class="info">
        <div class="num">序号 ${w.id}</div>
        <div class="name">${w.name}</div>
        <div class="meta">
          <div class="votes"><b data-vid="${w.id}">${v}</b>票</div>
          <button class="btn vote ${canVote?'':'done'}" data-btn="${w.id}"
                  ${canVote?'':'disabled'}>
            ${mine>0?'已投':(canVote?'投一票':'票已用完')}
          </button>
        </div>
      </div>
    </div>`;
  }).join("");

  document.getElementById("totalVotes").textContent = total;

  grid.querySelectorAll("[data-btn]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      doVote(parseInt(btn.dataset.btn));
    });
  });

  // 若大图开着，同步刷新其票数/按钮
  if(lbIndex >= 0) renderLightboxInfo();
}

/* ===== 详情大图 ===== */
function findIndexById(id){ return works.findIndex(w=> w.id === id); }

function openLightbox(id){
  lbIndex = findIndexById(id);
  if(lbIndex < 0) return;
  document.getElementById("lightbox").classList.add("show");
  renderLightbox();
}

function renderLightbox(){
  if(lbIndex < 0) return;
  const w = works[lbIndex];
  document.getElementById("lightboxImg").src = "images/" + w.id + ".jpg";
  document.getElementById("lightboxCap").textContent = w.name;
  document.getElementById("lightboxCount").textContent =
    "第 " + (lbIndex+1) + " / " + works.length + " 件 · 序号 " + w.id;
  renderLightboxInfo();
}

function renderLightboxInfo(){
  if(lbIndex < 0) return;
  const w = works[lbIndex];
  const used = myTicketUsed();
  const mine = myVotes[w.id] || 0;
  const canVote = (MAX_TICKETS - used) > 0 && mine < 1;
  document.getElementById("lightboxVotes").textContent = getVote(w.id);
  const b = document.getElementById("lightboxVoteBtn");
  b.textContent = mine>0 ? "已投" : (canVote ? "投一票" : (used>=MAX_TICKETS ? "票已用完" : "已投"));
  b.disabled = !canVote;
  b.classList.toggle("done", !canVote);
}

function closeLightbox(){
  document.getElementById("lightbox").classList.remove("show");
  lbIndex = -1;
}
function stepLightbox(d){
  if(lbIndex < 0) return;
  lbIndex = (lbIndex + d + works.length) % works.length;
  renderLightbox();
}

document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lbPrev").addEventListener("click", (e)=>{ e.stopPropagation(); stepLightbox(-1); });
document.getElementById("lbNext").addEventListener("click", (e)=>{ e.stopPropagation(); stepLightbox(1); });
document.getElementById("lightboxVoteBtn").addEventListener("click", (e)=>{
  e.stopPropagation();
  if(lbIndex >= 0) doVote(works[lbIndex].id);
});
// 点背景关闭（点图片/按钮不关）
document.getElementById("lightbox").addEventListener("click", (e)=>{
  if(e.target.id === "lightbox") closeLightbox();
});
// 键盘左右切换
document.addEventListener("keydown", (e)=>{
  if(lbIndex < 0) return;
  if(e.key === "Escape") closeLightbox();
  else if(e.key === "ArrowLeft") stepLightbox(-1);
  else if(e.key === "ArrowRight") stepLightbox(1);
});
// 手机滑动切换
let _tx=0;
const lb = document.getElementById("lightbox");
lb.addEventListener("touchstart", (e)=>{ _tx = e.changedTouches[0].clientX; }, {passive:true});
lb.addEventListener("touchend", (e)=>{
  if(lbIndex < 0) return;
  const dx = e.changedTouches[0].clientX - _tx;
  if(Math.abs(dx) > 50) stepLightbox(dx > 0 ? -1 : 1);
}, {passive:true});

/* ===== 投票 ===== */
async function doVote(id){
  const used = myTicketUsed();
  if(used >= MAX_TICKETS){ toast("你已用完 2 票啦～"); return; }
  if((myVotes[id]||0) >= 1){ toast("同一作品只能投 1 票"); return; }

  myVotes[id] = (myVotes[id]||0) + 1;
  setMyVotes(myVotes);
  votes[String(id)] = getVote(id) + 1;

  const el = document.querySelector(`[data-vid="${id}"]`);
  if(el) el.textContent = getVote(id);
  render();
  toast("投票成功 🎉");

  try{
    const r = await fetch(API, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id})
    });
    const d = await r.json();
    if(d && d.votes){
      votes = d.votes;
      render();
    }
  }catch(e){ console.warn("同步失败", e); }
}

(async function init(){
  myVotes = getMyVotes();
  try{
    await Promise.all([fetchWorks(), fetchVotes()]);
    render();
    setInterval(async ()=>{
      try{ await fetchVotes(); render(); }catch(e){}
    }, 10000);
  }catch(e){
    document.getElementById("grid").innerHTML =
      '<div class="loading">加载失败，请刷新页面重试</div>';
  }
})();
</script>
</body>
</html>
